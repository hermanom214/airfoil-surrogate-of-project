device: cuda # auto | cpu | cuda; cuda fails immediately when unavailable

model:
  name: "simple_unet" # možnosti: "simple_unet" | "rans_pinn" | "clcd_mlp"
  params:
    simple_unet:
      in_channels: 5 # obvykle 5; měň jen pokud změníš vstupní featury datasetu
      out_channels: 3 # obvykle 3 (p, Ux, Uy)
      encoder_channels: [32, 64, 128] # rozumně [16,32,64] až [64,128,256]
      bottleneck_channels: 256 # typicky 2x až 4x poslední encoder channel
    rans_pinn:
      in_channels: 5 # obvykle 5
      out_channels: 3 # obvykle 3
      hidden_channels: 128 # rozumně 64–256 (víc = vyšší paměť/čas)
      depth: 6 # rozumně 4–10 (vyšší = větší kapacita i riziko nestability)
    clcd_mlp:
      input_dim: 5 # [camber_percent, camber_position_tenths, thickness_percent, aoa_deg, inlet_velocity]
      hidden_dims: [64, 64] # rozumně [32,32] až [256,256,128]
      output_dim: 2 # [Cl, Cd]
      dropout: 0.0 # rozumně 0.0–0.3
      cases_subdir: "." # relativně k paths.flow_fields_output
      force_coeffs_relpath: "postProcessing/forceCoeffs1/0/forceCoeffs.dat"
      tail_window: 200 # průměr Cl/Cd z posledních N iterací

training:
  batch_size: 2 # rozumně 1–16 dle GPU RAM
  epochs: 30 # rozumně 20–300 dle konvergence
  learning_rate: 0.001 # rozumně 1e-4 až 3e-3 (Adam)
  validation_split: 0.2 # rozumně 0.1–0.3
  split_seed: 42 # libovolné celé číslo pro reprodukovatelnost

data_split:
  test_fraction: 0.20
  seed: 42
  cv_strategy: kfold # kfold | group_kfold_naca
  regenerate_on_dataset_change: false

hyperparameter_search:
  seed: 42

# Each model selects its own execution mode. Shared split/search values above
# are inherited, but cv_enabled, n_folds and strategy have one model-local source.
experiments:
  clcd_mlp:
    data_split: {cv_enabled: false, n_folds: 5}
    hyperparameter_search:
      strategy: none # randomized pro CV s hyperparameter search
      n_iter: 20
      search_space:
        learning_rate: [0.001, 0.0003, 0.0001]
        batch_size: [16, 32, 64]
        weight_decay: [0.0, 0.00001, 0.0001]
        dropout: [0.0, 0.1, 0.2]
        hidden_dims: [[32, 32], [64, 64], [128, 128, 64]]
  simple_unet:
    data_split: {cv_enabled: true, n_folds: 3}
    hyperparameter_search:
      strategy: manual_coarse
      manual_coarse_configs:
        - {learning_rate: 0.001, batch_size: 2, weight_decay: 0.0, encoder_channels: [32, 64, 128], bottleneck_channels: 256}
        - {learning_rate: 0.0003, batch_size: 2, weight_decay: 0.00001, encoder_channels: [32, 64, 128], bottleneck_channels: 256}
        - {learning_rate: 0.0003, batch_size: 2, weight_decay: 0.00001, encoder_channels: [16, 32, 64], bottleneck_channels: 128}
  rans_pinn:
    data_split: {cv_enabled: false, n_folds: 3}
    hyperparameter_search:
      strategy: none # manual_coarse pro CV s hyperparameter search
      manual_coarse_configs:
        - {learning_rate: 0.001, physics_loss.weight: 1.0e-8, physics_loss.warmup_epochs: 30}
        - {learning_rate: 0.0003, physics_loss.weight: 1.0e-8, physics_loss.warmup_epochs: 30}
        - {learning_rate: 0.0003, physics_loss.weight: 1.0e-7, physics_loss.warmup_epochs: 20}

physics_loss:
  nu: 1.5e-5 # kinematická viskozita [m^2/s], typicky 1e-6 až 1e-4 dle média
  weight: 1.0e-8 # váha physics loss, rozumně 1e-10 až 1e-3
  warmup_epochs: 30 # rozumně 0 až ~50 % celkových epoch
  u_scale: 50.0 # deprecated: physics residual now uses dataset ux/uy mean/std denormalization
  p_scale: 1000.0 # deprecated: physics residual now uses dataset p mean/std denormalization
  pressure_is_kinematic: true # true pro kinematický tlak p/rho, false pro absolutní tlak
  mask_erode_pixels: 1 # rozumně 0–3 (větší = menší vliv stěnových buněk)

output:
  models_subdir: "data/models" # relativní cesta od project root
  filename_template: "{model_name}_airfoil.pt" # lze použít placeholder {model_name}
